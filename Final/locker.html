<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary</title>
    <link rel="stylesheet" href="style2.css">
    <script src="script2.js" defer></script>
</head>
<body>
    <div class="diary">
    <p class="diary date">March 22, 2019</p>
    <p class="diary one">
      The bell is about to <span id="ringWord" class="diary-click">ring</span>. I’m already late.
    </p>
    <p class="diary two">
      I run to my locker, hoping today will just be… normal.
    </p>
    <p class="diary action" id="openLocker">
      I open the locker.
    </p>
    <div class="diary-line" id="lockerItems">
    <span class="locker-item pad">a blood-stained pad</span>
    <span class="locker-item rat">a dead rat</span>
    <span class="locker-item bag">a bag</span>
    <span class="locker-item money">money</span>
  </div>
  <p class="diary cry">Who did that? When will this bully stop?</p>
  <audio id="bellSound" src="sounds/bell.MP3"></audio>
  <audio id="screamSound" src="sounds/scream.MP3"></audio>
</body>
</html>
